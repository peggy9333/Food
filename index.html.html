
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>餐食卡判斷系統</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 24px 16px;
  font-family: "Microsoft JhengHei", sans-serif;
  background: #f3f5f8;
  color: #253247;
}

.container {
  max-width: 780px;
  margin: auto;
  padding: 28px;
  background: white;
  border-radius: 16px;
  box-shadow: 0 4px 20px #17203312;
}

h1 {
  font-size: 26px;
  margin: 0 0 8px;
}

.subtitle, .hint {
  color: #667085;
  line-height: 1.7;
}

.section-title {
  margin: 26px 0 12px;
  font-weight: bold;
}

.scenarios {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}

button {
  font: inherit;
  cursor: pointer;
  border-radius: 9px;
  padding: 12px;
  border: 1px solid #d0d5dd;
  background: white;
  color: #253247;
}

button:hover {
  border-color: #4575cc;
}

button.active {
  background: #eaf1ff;
  border: 2px solid #4575cc;
  color: #204b9b;
  font-weight: bold;
}

.question {
  margin-top: 16px;
  padding: 16px;
  border: 1px solid #e1e5eb;
  border-radius: 12px;
}

.options {
  display: flex;
  gap: 9px;
  flex-wrap: wrap;
  margin-top: 12px;
}

.options button {
  min-width: 90px;
}

.result {
  margin-top: 22px;
  padding: 20px;
  border-radius: 12px;
  background: #f0f6ff;
  border: 1px solid #cbdcf8;
}

.result h2 {
  font-size: 16px;
  font-weight: normal;
  color: #667085;
  margin: 0 0 12px;
}

.result-message {
  font-size: 20px;
  font-weight: bold;
  line-height: 1.6;
  margin: 0;
  color: #204b9b;
  white-space: pre-line;
}

.hint {
  font-size: 13px;
}

.reset {
  margin-top: 18px;
  background: #253247;
  color: white;
  border-color: #253247;
}

@media(max-width: 520px) {
  .container {
    padding: 20px 15px;
  }

  .scenarios {
    grid-template-columns: 1fr;
  }

  h1 {
    font-size: 23px;
  }
}
</style>
</head>

<body>
<main class="container">

  <h1>餐食卡無法領餐判斷系統</h1>

  <p class="subtitle">
    <mark><strong>請先與客戶釐清無法領用當下的錯誤狀況</strong></<mark>
	<br>再依序選擇以下情境，系統會自動顯示建議處理方式。
  </p>

  <div class="section-title">第一步：釐清後請選擇問題情境<mark>(非依照領用錯誤記錄選擇)</mark></div>

  <div class="scenarios" id="scenarios"></div>
  <div id="questions"></div>
  <div id="result" aria-live="polite"></div>

  <button class="reset" onclick="resetAll()">重新開始</button>

  <p class="hint">
   
  </p>

</main>

<script>
const scenarios = {
  sensor: "無法感應／感應異常／顯示卡片失效",
  redeemed: "本日已兌領",
  card: "卡片非餐食卡或已過期",
  day: "本日非兌領日"
};

let current = "sensor";
let answers = {};

// 判斷建議處理方式
function diagnose() {
  const s = answers;

  // 共用規則 1：卡片設定餐食卡
  if (s.setting === "未設定") {
    return "找班導師／午餐執秘設定";
  }

  if (s.setting !== "正常") return null;

  // 尚未選擇卡片效期
  if (!s.expiry) return null;

  // 共用規則 2：卡片已過效期
  // 不需再確認行事曆
  if (s.expiry === "已過效期") {
    return "找班導師／午餐執秘設定";
  }

  // 卡片設定正常且效期正常，才確認行事曆
  if (!s.calendar) return null;

  // 共用規則 3：行事曆不可領
  if (s.calendar === "不可領") {
    return "找班導師／午餐執秘設定";
  }

  // 本日非兌領日
  if (current === "day") {
    if (s.calendar === "—") {
      return null;
    }

    if (s.calendar === "正常" && s.success === "無") {
      return "先更換其他通路嘗試，若仍無效請開BTS單確認";
    }

    if (s.calendar === "正常" && s.success === "有") {
      return "先嘗試重印小白單，若仍無效請更換其他通路嘗試";
    }

    return null;
  }

  // 無法感應／感應異常／顯示卡片失效
  if (current === "sensor") {
    if (s.success === "無") {
      return "先嘗試手輸卡號+學號(台南餐食請輸入電話)方式領餐。\n若仍無效請更換其他通路嘗試";
    }

    if (s.success === "有") {
      return "先嘗試重印小白單，若仍無效請更換其他通路嘗試";
    }
  }

  // 本日已兌領
  if (current === "redeemed") {
    if (s.success === "無") {
      return "先更換其他通路嘗試，若仍無效請開BTS單確認";
    }

    if (s.success === "有") {
      return "告知目前看到領取成功的時間，建議詢問家人是否領過。\n若客戶確認沒有人領過，請客戶更換其他通路嘗試";
    }
  }

  // 卡片非餐食卡或已過期
  if (current === "card") {
    if (s.success === "無") {
      return "先更換其他通路嘗試，若仍無效請開BTS單確認";
    }

    if (s.success === "有") {
      return "先嘗試重印小白單，若仍無效請更換其他通路嘗試";
    }
  }

  return null;
}

// 選擇問題情境
function chooseScenario(id) {
  current = id;
  answers = {};
  render();
}

// 選擇檢查結果
function chooseAnswer(id, value) {
  answers[id] = value;

  // 卡片未設定時，不需要確認後續欄位
  if (id === "setting" && value === "未設定") {
    delete answers.expiry;
    delete answers.calendar;
    delete answers.success;
  }

  // 卡片效期變更時，清除後續答案
  if (id === "expiry") {
    delete answers.calendar;
    delete answers.success;
  }

  // 行事曆變更時，重新確認領用紀錄
  if (id === "calendar") {
    delete answers.success;
  }

  render();
}

// 建立選項區塊
function addQuestion(container, id, label, options) {
  const section = document.createElement("section");
  section.className = "question";

  const title = document.createElement("strong");
  title.textContent = label;
  section.appendChild(title);

  const choices = document.createElement("div");
  choices.className = "options";

  options.forEach(option => {
    const button = document.createElement("button");

    button.textContent = option;
    button.className =
      answers[id] === option ? "active" : "";

    button.setAttribute(
      "aria-pressed",
      answers[id] === option ? "true" : "false"
    );

    button.onclick = () => chooseAnswer(id, option);
    choices.appendChild(button);
  });

  section.appendChild(choices);
  container.appendChild(section);
}

// 更新網頁
function render() {
  const scenarioBox = document.getElementById("scenarios");
  const questionBox = document.getElementById("questions");
  const resultBox = document.getElementById("result");

  scenarioBox.innerHTML = "";
  questionBox.innerHTML = "";
  resultBox.innerHTML = "";

  // 顯示四種問題情境
  Object.entries(scenarios).forEach(([id, title], index) => {
    const button = document.createElement("button");

    button.textContent = `${index + 1}. ${title}`;
    button.className = id === current ? "active" : "";
    button.onclick = () => chooseScenario(id);

    scenarioBox.appendChild(button);
  });

  // 第一項：卡片設定餐食卡
  addQuestion(
    questionBox,
    "setting",
    "第二步：卡片設定餐食卡",
    ["未設定", "正常"]
  );

  if (answers.setting === "正常") {
    // 第二項：卡片效期
    addQuestion(
      questionBox,
      "expiry",
      "第三步：卡片效期",
      ["已過效期", "正常"]
    );

    // 已過效期時，直接顯示結果，不再顯示後續欄位
    if (answers.expiry === "正常") {
      // 第三項：行事曆(有分在校/畢業生行事曆)
      addQuestion(
        questionBox,
        "calendar",
        "第四步：行事曆(有分在校/畢業生行事曆)",
        ["不可領", "正常"]
      );

      // 行事曆不可領時，直接顯示結果
      if (answers.calendar === "正常" ||
          (answers.calendar === "—" && current !== "day")) {

        addQuestion(
          questionBox,
          "success",
          "第五步：領用成功紀錄",
          ["無", "有"]
        );
      }
    }
  }

  // 只顯示建議處理方式，不顯示步驟或條件說明
  const recommendation = diagnose();

  if (recommendation) {
    const panel = document.createElement("section");
    panel.className = "result";

    const heading = document.createElement("h2");
    heading.textContent = "建議處理方式";

    const message = document.createElement("p");
    message.className = "result-message";
    message.textContent = recommendation;

    panel.appendChild(heading);
    panel.appendChild(message);
    resultBox.appendChild(panel);
  } else {
    // 尚未完成檢查時，不顯示多餘的處理步驟
    const complete =
      answers.setting === "正常" &&
      answers.expiry === "正常" &&
      answers.calendar === "—" &&
      current === "day";

    if (complete) {
      const panel = document.createElement("section");
      panel.className = "result";

      const heading = document.createElement("h2");
      heading.textContent = "建議處理方式";

      const message = document.createElement("p");
      message.className = "result-message";
      message.textContent = "請確認行事曆紀錄";

      panel.appendChild(heading);
      panel.appendChild(message);
      resultBox.appendChild(panel);
    }
  }
}

// 重新開始
function resetAll() {
  current = "sensor";
  answers = {};
  render();
}

render();
</script>
</body>
</html>
