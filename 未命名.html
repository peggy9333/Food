
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>問卡號／內碼判斷系統</title>
<style>
*{box-sizing:border-box}

body{
  margin:0;
  padding:24px 16px;
  font-family:"Microsoft JhengHei",Arial,sans-serif;
  background:#f3f5f8;
  color:#253247;
}

.container{
  max-width:780px;
  margin:auto;
  padding:28px;
  background:#fff;
  border-radius:16px;
  box-shadow:0 4px 20px #17203312;
}

h1{font-size:26px;margin:0 0 8px}
.subtitle,.hint{color:#667085;line-height:1.7}
.section-title{margin:26px 0 12px;font-weight:bold}

.scenarios{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
}

button{
  font:inherit;
  cursor:pointer;
  border-radius:9px;
  padding:12px;
  border:1px solid #d0d5dd;
  background:#fff;
  color:#253247;
}

button:hover{border-color:#4575cc}

button.active{
  background:#eaf1ff;
  border:2px solid #4575cc;
  color:#204b9b;
  font-weight:bold;
}

.question{
  margin-top:16px;
  padding:16px;
  border:1px solid #e1e5eb;
  border-radius:12px;
}

.options{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
  margin-top:12px;
}

.options button{min-width:90px}

.result{
  margin-top:22px;
  padding:20px;
  border-radius:12px;
  background:#f0f6ff;
  border:1px solid #cbdcf8;
}

.result h2{
  font-size:16px;
  font-weight:normal;
  color:#667085;
  margin:0 0 12px;
}

.result-message{
  font-size:20px;
  font-weight:bold;
  line-height:1.6;
  margin:0;
  color:#204b9b;
  white-space:pre-line;
}

.hint{font-size:13px}

.reset{
  margin-top:18px;
  background:#253247;
  color:white;
  border-color:#253247;
}

@media(max-width:520px){
  .container{padding:20px 15px}
  .scenarios{grid-template-columns:1fr}
  h1{font-size:23px}
}
</style>
</head>

<body>
<main class="container">

  <h1>問卡號／內碼判斷系統</h1>

  <p class="subtitle">
    <mark><strong>請先確認來電類型</strong></mark>
    <br>
    再依序選擇實際情況，系統會自動顯示建議處理方式。
  </p>

  <div class="section-title">
    第一步：請選擇來電類型
  </div>

  <div class="scenarios" id="scenarios"></div>
  <div id="questions"></div>
  <div id="result" aria-live="polite"></div>

  <button class="reset" onclick="resetAll()">重新開始</button>

  <p class="hint">
    提醒：話術 A／B／C 依原流程圖標示；
    如需逐字話術，請使用內部核定版本。
  </p>

</main>

<script>
const scenarios = {
  police: "警局／客運來電",
  general: "一般用戶來電"
};

let current = "general";
let answers = {};

// 選擇來電類型
function chooseScenario(id) {
  current = id;
  answers = {};
  render();
}

// 選擇答案，清除後續步驟的答案
function chooseAnswer(id, value) {
  answers[id] = value;

  const clearAfter = {
    lost: ["cardType", "seen", "cardKind"],
    cardType: ["seen", "cardKind"],
    seen: ["cardKind"]
  };

  if (clearAfter[id]) {
    clearAfter[id].forEach(key => delete answers[key]);
  }

  render();
}

// 建立問題與選項
function addQuestion(container, id, label, options) {
  const section = document.createElement("section");
  section.className = "question";

  const title = document.createElement("strong");
  title.textContent = label;
  section.appendChild(title);

  const choices = document.createElement("div");
  choices.className = "options";

  options.forEach(option => {
    const button = document.createElement("button");

    button.textContent = option;
    button.className =
      answers[id] === option ? "active" : "";

    button.setAttribute(
      "aria-pressed",
      answers[id] === option ? "true" : "false"
    );

    button.onclick = () => chooseAnswer(id, option);
    choices.appendChild(button);
  });

  section.appendChild(choices);
  container.appendChild(section);
}

// 顯示建議處理方式
function showResult(container, message) {
  const panel = document.createElement("section");
  panel.className = "result";

  const heading = document.createElement("h2");
  heading.textContent = "建議處理方式";

  const text = document.createElement("p");
  text.className = "result-message";
  text.innerHTML = message;

  panel.appendChild(heading);
  panel.appendChild(text);
  container.appendChild(panel);
}

// 更新網頁
function render() {
  const scenarioBox = document.getElementById("scenarios");
  const questionBox = document.getElementById("questions");
  const resultBox = document.getElementById("result");

  // 每次重新繪製，先清除舊內容
  scenarioBox.innerHTML = "";
  questionBox.innerHTML = "";
  resultBox.innerHTML = "";

  // 第一步：選擇來電類型
  Object.entries(scenarios).forEach(([id, title]) => {
    const button = document.createElement("button");

    button.textContent = title;
    button.className = current === id ? "active" : "";
    button.onclick = () => chooseScenario(id);

    scenarioBox.appendChild(button);
  });

  // 警局／客運來電
  if (current === "police") {
    showResult(
      resultBox,
      "不須核資，且不論是否為記名卡都可直接提供卡號／內碼／十禁制內碼。"
    );
    return;
  }

  // 第二步：卡片是否遺失
  addQuestion(
    questionBox,
    "lost",
    "第二步：卡片是否遺失",
    ["遺失", "非遺失"]
  );

  if (!answers.lost) return;

  // 第三步：卡片類型
  addQuestion(
    questionBox,
    "cardType",
    "第三步：卡片類型",
    ["記名卡", "不記名卡"]
  );

  if (!answers.cardType) return;

  // 遺失的不記名卡
  if (
    answers.lost === "遺失" &&
    answers.cardType === "不記名卡"
  ) {
    showResult(
      resultBox,
      "票卡遺失等同現金遺失，我們也無法提供卡號。"
    );
    return;
  }

  // 非遺失的記名卡
  if (
    answers.lost === "非遺失" &&
    answers.cardType === "記名卡"
  ) {
    showResult(
      resultBox,
      "核資正確後，可直接提供卡號／內碼／十禁制內碼給本人或法定代理人。"
    );
    return;
  }

  // 非遺失的不記名卡
  if (
    answers.lost === "非遺失" &&
    answers.cardType === "不記名卡"
  ) {
    showResult(
      resultBox,
      "需二擇一提供到客服信箱：(1) 票卡正反面彩色照片，或 (2) 加值小白單。\n收到資料核對無誤後才可提供卡號／內碼給客戶。"
    );
    return;
  }

  // 遺失的記名卡
  if (
    answers.lost === "遺失" &&
    answers.cardType === "記名卡"
  ) {
    // 第四步：請先透過下方建議處理方式引導，確認是否可看到記名卡資料
    addQuestion(
      questionBox,
      "seen",
      "第四步：請先透過下方建議處理方式引導，確認是否可看到記名卡資料？",
      ["有看到", "沒有看到／不願意"]
    );

    // 尚未選擇第四步時，才顯示查詢引導
    if (!answers.seen) {
      showResult(
        resultBox,
        "引導透過官網 > 客戶服務 > 「普通卡記名」\n或  iPASS MONEY  APP > 票卡 > 匯入記名卡查詢"
      );
      return;
    }

    // 有看到：只顯示此結果
    if (answers.seen === "有看到") {
      showResult(resultBox, "恭喜他解決問題");
      return;
    }

    // 沒有看到／不願意：不再顯示查詢引導
    addQuestion(
      questionBox,
      "cardKind",
      "第五步：請選擇卡片類型",
      ["社福卡", "學生證", "聯名卡","其他卡片"]
    );

    if (!answers.cardKind) return;

    // 第五步只顯示一個對應的話術

const scripts = {
  "社福卡": `核資完成後，多核對三項個資：
(1) 出生年月日
(2) 戶籍地址
(3) 電話

核對後可以提供卡號給本人。

（若記名資料上沒有電話，則可不必核對此項；但若沒有戶籍地址可核對，就額外確認。）`,

  "學生證": `<mark>仍有記名的學生證(=尚未畢業/有額外記名)</mark>，核資完成後，多核對兩項個資：
(1) 學號
(2) 科系

核對後可以提供卡號給本人／法定代理人。

後補記名、記名不在一卡通的學生證，都無法提供。`,

  "聯名卡": `<mark>已下黑名單的聯名卡</mark>，核資完成後，不用多核對其他資料，即可以提供卡號給本人。`,
  "其他卡片": `請詢問一卡通是否可個案提供。`

};

showResult(resultBox, scripts[answers.cardKind]);

  }
}

// 重新開始
function resetAll() {
  current = "general";
  answers = {};
  render();
}

render();
</script>
</body>
</html>
